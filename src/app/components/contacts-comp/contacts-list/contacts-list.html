<section id="contact-list">
    <div id="add-contact">
        <button (click)="addContact.emit()">
            <p>Add Contact</p>
            <p>&#128100;</p>
            <!-- <img src="../../../../../public/icons/add-contact-white.svg" alt=""> -->
        </button>
    </div>
    <section class="contact-list-wrapper">
        @for (item of dbService.groupedContacts(); track item[0]) {
            <div class="contact-group">
                <h3>{{ item[0] }}</h3>
            </div>

            @for (contact of item[1]; track contact.id) {
                <button>
                    <div class="contact-preview-card" (click)="selectedContact.emit(contact)">
                        <div class="profile-picture" [style.background]="contact.profile_color">
                            <p class="initials">{{ contact.name | initials }}</p>
                        </div>
                        <div class="contact-details">
                            <p class="contact-detail-text">{{ contact.name }}</p>
                            <p class="contact-detail-text contact-email">{{ contact.email }}</p>
                        </div>
                    </div>
                </button>
            }
        }
    </section>
</section>
