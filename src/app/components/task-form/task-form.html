<section id="add-task" [class.edit-mode]="!!task()">
    <div class="add-task-header">
        <h1>Add Task</h1>

        @if (showCloseButton()) {
            <button
                class="close-btn-x"
                type="button"
                aria-label="Close"
                (click)="closeDialog.emit()"
            >
                &times;
            </button>
        }
    </div>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" id="taskform">
        <section id="taskform-content">
            <div class="form-column">
                <div class="input-fields-group">
                    <div class="input-field-div">
                        <label for="title" class="input-field-title"
                            >Title<span class="red">*</span></label
                        >
                        <textarea
                            id="title"
                            class="input-field"
                            id="text"
                            formControlName="title"
                            rows="2"
                            cols="50"
                        ></textarea>
                    </div>
                    <div class="input-field-div">
                        <label for="description" class="input-field-title">Description</label>
                        <textarea
                            id="description"
                            class="input-field"
                            id="text"
                            formControlName="description"
                            rows="10"
                            cols="50"
                        ></textarea>
                    </div>
                    <div class="input-field-div">
                        <label for="due-date" class="input-field-title"
                            >Due Date<span class="red">*</span></label
                        >
                        <input
                            id="due-date"
                            type="date"
                            formControlName="dueDate"
                            class="input-field"
                        />
                    </div>
                </div>
            </div>
            <div id="column-separation-line">
                <img src="icons/grey-separation-line.svg" alt="" />
            </div>
            <div class="form-column">
                <div class="input-fields-group">
                    <div class="input-field-div">
                        <label for="priority" class="input-field-title">Priority</label>
                        <div id="priority">
                            <button
                                type="button"
                                class="priority-button priority-urgent"
                                [class]="urgentSelected"
                                (click)="getPriority('Urgent')"
                            >
                                <p>Urgent</p>
                                <div class="priority-icon icon-urgent"></div>
                            </button>
                            <button
                                type="button"
                                class="priority-button priority-medium"
                                [class]="mediumSelected"
                                (click)="getPriority('Medium')"
                            >
                                <p>Medium</p>
                                <div class="priority-icon icon-medium"></div>
                            </button>
                            <button
                                type="button"
                                class="priority-button priority-low"
                                [class]="lowSelected"
                                (click)="getPriority('Low')"
                            >
                                <p>Low</p>
                                <div class="priority-icon icon-low"></div>
                            </button>
                        </div>
                    </div>
                    <div class="input-field-div" id="assignees">
                        <label for="assignees" class="input-field-title">Assigned to</label>
                        <div
                            id="assignee-dropdown"
                            class="input-field"
                            (click)="toggleDisplayNone()"
                        >
                            <p>Select contacts to assign</p>
                            <div [class]="dropdownArrow"></div>
                        </div>
                        <div id="list-of-assignees" [class]="divClassList">
                            @for (contact of dbService.contacts(); track contact.id) {
                                <button
                                    type="button"
                                    class="assignee-box"
                                    (click)="assignContact(contact)"
                                >
                                    <div
                                        class="initials"
                                        [style.background]="contact.profile_color"
                                    >
                                        <p>{{ contact.name | initials }}</p>
                                    </div>
                                    <div class="label">
                                        <label class="label-text" for="{{ contact.name }}">{{
                                            contact.name
                                        }}</label>
                                    </div>
                                    <input
                                        formControlName="assignees"
                                        type="checkbox"
                                        id="{{ contact.id }}"
                                        name="{{ contact.name }}"
                                        value=""
                                        (click)="assignContact(contact)"
                                    />
                                </button>
                            }
                        </div>
                        <div id="assigned-contacts-avatars">
                            @for (assignee of assignees(); track $index) {
                                <div
                                    class="initials"
                                    [style.background]="assignees()[$index].profile_color"
                                >
                                    <p>{{ assignees()[$index].name | initials }}</p>
                                </div>
                            }
                        </div>
                    </div>

                    <div class="input-field-div" id="category">
                        <label for="category" class="input-field-title"
                            >Category<span class="red">*</span></label
                        >
                        <select formControlName="category" class="input-field">
                            <option class="input-field">Choose a category</option>
                            @for (category of categories; track $index) {
                                <option class="input-field">{{ category }}</option>
                            }
                        </select>
                    </div>
                    <div class="input-field-div" id="subtasks">
                        <label for="subtasks" class="input-field-title">Subtasks</label>
                        <div class="subtasks-btn">
                            <textarea
                                id="input-subtask"
                                type="text"
                                class="input-field"
                                placeholder="Add new subtask"
                            ></textarea>

                            <div class="subtask-actions">
                                <button
                                    class="subtask-delete-btn"
                                    type="button"
                                    aria-label="Delete subtask"
                                    (click)="clearSubtaskInput()"
                                >
                                    <img src="icons/close-blue.svg" alt="checkmark icon" />
                                </button>
                                <div class="divider"></div>
                                <button
                                    class="subtask-add-btn"
                                    type="button"
                                    aria-label="Add subtask"
                                    (click)="addSubtask()"
                                >
                                    <img src="icons/checkmark-blue.svg" alt="checkmark icon" />
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="subtask-items">
                        @for (item of subtasks(); track $index) {
                            <div class="subtask-item">
                                <div class="subtask-content">
                                    <input
                                        type="checkbox"
                                        id="subtasks-{{ $index }}"
                                        name="subtasks-{{ $index }}"
                                        [checked]="item.checked"
                                        (change)="toggleSubtask(item)"
                                        value="{{ item.description }}"
                                    />
                                    <label for="">{{ item.description }}</label
                                    ><br />
                                </div>

                                <div class="added-subtask-actions">
                                    <button
                                        class="added-subtask-delete-btn"
                                        type="button"
                                        aria-label="Delete subtask"
                                    >
                                        <img src="icons/delete-bin-blue.svg" alt="checkmark icon" />
                                    </button>
                                    <div class="added-divider"></div>
                                    <button
                                        class="added-subtask-edit-btn"
                                        type="button"
                                        aria-label="Add subtask"
                                        /* (click)="addSubtask()" */
                                    >
                                        <img src="icons/edit-pen-blue.svg" alt="checkmark icon" />
                                    </button>
                                </div>
                            </div>
                        }
                    </div>
                </div>
            </div>
        </section>
        <section id="taskform-footer">
            <div id="disclaimer-text">
                <p><span class="red">*</span>This field is required</p>
            </div>
            <div id="create-or-clear">
                <button type="button" (click)="formReset()">
                    <p>Clear</p>
                    <img src="icons/close-blue.svg" alt="" />
                </button>
                <button type="submit" [disabled]="!taskForm.valid">
                    <p>Create Task</p>
                    <img src="icons/checkmark-blue.svg" alt="" />
                </button>
            </div>
        </section>
        <section class="edit_form_submit">
            <button type="submit" [disabled]="!taskForm.valid" class="submit">
                <p>Ok</p>
                <img src="icons/checkmark-white.svg" alt="" />
            </button>
        </section>
    </form>
</section>
