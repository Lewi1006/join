<section class="contacts">
    <div class="contact_list">
        <app-contacts-list (selectedContact)="contactWasSelected($event)"></app-contacts-list>
    </div>
    <div class="contact_card">
        <app-contacts-card [contact]="selectedContact()"></app-contacts-card>
    </div>
</section>

<dialog class="contact_form" open><app-contacts-form></app-contacts-form></dialog>
