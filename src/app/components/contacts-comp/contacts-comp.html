<section class="contacts">
    <div class="contact_list">
        <app-contacts-list (selectedContact)="contactWasSelected($event)"></app-contacts-list>
    </div>
    <div class="contact_card">
        <app-contacts-card
            [receivedContact]="selectedContact()"
            (deletedContact)="contactWasDeleted($event)"
        ></app-contacts-card>
    </div>
</section>
