<section class="contacts">
    <div class="contact_list">
        <app-contacts-list (selectedContact)="contactWasSelected($event)"></app-contacts-list>
    </div>
    <div class="contact_card">
        <app-contacts-card [contact]="selectedContact()" (editContact)="openEditForm(contactsDialog)"></app-contacts-card>
    </div>
</section>

<dialog #contactsDialog class="contact_form"><app-contacts-form></app-contacts-form></dialog>
