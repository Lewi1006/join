<section class="board">
    <div class="board-header">
        <h1>Board</h1>

        <div class="board-header-actions">
            <div class="search-field">
                <label for="find"></label>
                <input
                    #find
                    id="find"
                    name="find"
                    type="search"
                    placeholder="Find task"
                    aria-label="Find task"
                    (input)="searchTerm.set(find.value)"
                />
                <div class="divider" aria-hidden="true"></div>
                <img src="icons/search.svg" alt="search icon" />
            </div>

            <button class="add-task-btn" (click)="openAddTaskDialog(addTaskDialog)">
                <span>Add task</span>
                <span>&#43;</span>
            </button>

            <dialog #addTaskDialog class="add-task-dialog">
                <app-task-comp></app-task-comp>
            </dialog>
        </div>
    </div>

    <div class="board-columns" cdkDropListGroup>
        @for (column of columns; track column.status) {
            <app-column-comp
                [title]="column.title"
                [status]="column.status"
                [task]="tasksForColumn(column.status)"
                (taskSelected)="openTaskDialog($event, taskDialog)"
                (taskDropped)="onTaskDropped($event, column.status)"
                (addColumnTask)="openAddTaskDialogFromColumn($event, addTaskDialog)"
            ></app-column-comp>
        }
    </div>

    <dialog #taskDialog class="task-dialog">
        @if (selectedTask(); as task) {
            <app-task-dialog-comp [task]="task" (closeDialog)="closeTaskDialog(taskDialog)">
            </app-task-dialog-comp>
        }
    </dialog>
</section>
