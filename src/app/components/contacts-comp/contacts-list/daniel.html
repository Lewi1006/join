@if (!loading() && !errorMessage()) {
    <div class="user-list">
        <button
            class="user-listadd"
            type="button"
            (click)="dialogservice.openDialog('edit-and-add-contact', 'add')"
        >
            <span>Add new contact</span>
            <span aria-hidden="true">＋</span>
        </button>

        @for (group of groupedProfiles(); track group.letter) {
            <section class="user-group">
                <h2>
                    <span>{{ group.letter }}</span>
                </h2>

                @for (profile of group.profiles; track profile.id) {
                    <a
                        class="user"
                        [routerLink]="['/contacts', profile.id]"
                        routerLinkActive="active"
                        #activeLink="routerLinkActive"
                    >
                        <app-user-badge
                            [userId]="profile.id"
                            [userName]="profile.user_name"
                            [active]="activeLink.isActive"
                        />

                        <div class="userinformation">
                            <p class="username">
                                {{ profile.user_name }}
                            </p>

                            <span class="useremail">
                                {{ profile.user_email }}
                            </span>
                        </div>
                    </a>
                }
            </section>
        }
    </div>
}
