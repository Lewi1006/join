@for (item of dbService.contacts(); track item.id; let i = $index) {

    <button (click)="addContact.emit()">Add Contact</button>
    <div class="contact-preview-card" (click)="selectedContact.emit(item)">
        <div class="contact-initials">
            <p>WM</p>
        </div>
        <div class="contact-details">
            <p>{{ item.name }}</p>
            <a href="mailto:">{{ item.email }}</a>
        </div>
    </div>
}
