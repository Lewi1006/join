<section class="column">
    <div class="column-header">
        <h2>{{title()}}</h2>
        <button class="add-btn" type="button">
            <span>&#43;</span>
        </button>
    </div>

    
    
    <div class="column-tasks">
        
        @for (task of columnTasks(); track task.id){
            <div class="task-card">
                <h3>{{task.title}}</h3>
                <p class="task-description">{{task.description}}</p>
            </div>

        }

    </div>
</section>
